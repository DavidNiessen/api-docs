openapi: 3.1.0
info:
  title: Example service
  version: v1
servers:
  - url: https://api.example.com
paths:
  /projects/{id}:
    get:
      operationId: getProject
      summary: Get project
      description: Retrieve one project by id.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: project-123
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema: { type: object }
