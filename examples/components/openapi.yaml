openapi: 3.1.0
info:
  title: Gallery API
  version: v1
paths:
  /health:
    get:
      operationId: health
      summary: Service health
      description: Check service health.
      responses:
        '200':
          description: Healthy
  /samples:
    post:
      operationId: sampleValues
      summary: Authored example values
      description: Inspect named examples and content types without sending a request.
      tags: [Examples]
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: [integer, 'null']
            examples:
              empty:
                summary: No value
                value: null
              zero:
                summary: Zero
                value: 0
          text/plain:
            schema:
              type: string
            example: '  keep these spaces  '
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                type: [integer, 'null']
              examples:
                empty:
                  summary: No value
                  value: null
                zero:
                  summary: Zero
                  value: 0
                remote:
                  externalValue: https://examples.invalid/payload.json
            text/plain:
              schema:
                type: string
              example: '  keep these spaces  '
        '204':
          description: Empty response
        '400':
          description: Invalid request
  /schemas:
    get:
      operationId: inspectSchemas
      summary: Inspect schema constraints
      description: Read boolean schemas, composition, tuples, dictionaries and nullable arrays.
      tags: [Examples]
      responses:
        '200':
          description: Schema gallery
          content:
            application/json:
              example: { id: 0 }
              schema:
                type: object
                minProperties: 1
                maxProperties: 20
                required: [id]
                additionalProperties: false
                properties:
                  id:
                    $ref: '#/components/schemas/Identifier'
                  forbidden: false
                  free: true
                  nullableAnnotation:
                    type: string
                    nullable: true
                  nullableList:
                    type: [array, 'null']
                    minItems: 1
                    maxItems: 3
                    items: { type: integer, minimum: 0 }
                  dictionary:
                    type: object
                    minProperties: 1
                    additionalProperties:
                      $ref: '#/components/schemas/Identifier'
                  tuple:
                    type: array
                    prefixItems:
                      - { type: string }
                      - false
                    items: false
                  choice:
                    type: string
                    minLength: 2
                    allOf:
                      - { enum: [alpha, beta] }
                      - { not: { const: bad } }
                    anyOf:
                      - { const: alpha }
                      - { const: beta }
                  values:
                    type: [string, 'null', boolean, number]
                    enum: [null, 'null', false, 0]
                    default: false
        '400':
          description: Invalid request
  /form-editor:
    post:
      operationId: editFormValues
      summary: Edit form values
      description: Generate form data or provide a literal encoded body.
      tags: [Examples]
      servers:
        - url: http://127.0.0.1:4010/v1
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name: { type: string }
                id: { type: integer }
                enabled: { type: boolean }
                tags: { type: array, items: { type: string } }
                address: { type: object, properties: { zip: { type: string } } }
                filters: { type: object }
                password: { type: string, format: password, writeOnly: true }
            encoding:
              tags: { style: form, explode: true }
              filters: { style: deepObject, explode: true }
            examples:
              values:
                summary: Logical form values
                value:
                  name: Example + team
                  id: 1
                  enabled: false
                  tags: [cat, dog]
                  address: { zip: '99999+1234' }
                  filters: { limit: 2, active: false }
                  password: fixture-form-password
              encoded:
                summary: Encoded wire example
                value: name=wire+example&password=fixture-wire-only
      responses:
        '200':
          description: Received encoded form
          content:
            application/json:
              schema: { type: object }
  /body-editor:
    post:
      operationId: editRequestFields
      summary: Edit request fields
      description: Edit object fields while retaining exact numeric values and redacting sensitive examples.
      tags: [Examples]
      servers:
        - url: http://127.0.0.1:4010/v1
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyInput'
            example:
              name: fixture
              enabled: false
              count: 0
              id: 1
              mode: auto
              note: hello
              options: [cat]
              metadata: { owner: team }
              password: fixture-body-password
              responseOnly: retained-read-only-value
              fixed: fixed
      responses:
        '200':
          description: Received request text
          content:
            application/json:
              schema: { type: object }
  /serialization/{color}:
    get:
      operationId: serializeParameters
      summary: Parameter serialization
      description: Exercise flat styles and a JSON-valued query parameter.
      tags: [Examples]
      servers:
        - url: http://127.0.0.1:4010/v1
      security:
        - bearer: []
      parameters:
        - name: color
          in: path
          required: true
          style: matrix
          explode: true
          schema: { type: array, items: { type: string } }
          example: [blue, black]
        - name: tags
          in: query
          required: true
          explode: false
          schema:
            $ref: '#/components/schemas/Colors'
          example: ['a,b', 'c&d']
        - name: payload
          in: query
          required: true
          content:
            application/json:
              schema: { type: string }
              example: hello world
        - name: X-Color
          in: header
          required: true
          explode: true
          schema: { type: object, additionalProperties: { type: integer } }
          example: { R: 100, G: 200 }
      responses:
        '200':
          description: Received serialization
          content:
            application/json:
              schema: { type: object }
  /projects:
    get:
      operationId: oauthProjects
      summary: Projects with OAuth
      description: Use a registered public client and PKCE to authorize a request.
      tags: [Examples]
      servers:
        - url: http://127.0.0.1:4010/v1
      security:
        - oauth: [projects:read]
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema: { type: object }
              example: { data: [] }
        '401':
          description: Authentication required
  /multipart-editor:
    post:
      operationId: uploadDocuments
      summary: Upload documents
      description: Send binary files alongside text values and JSON metadata.
      tags: [Examples]
      servers:
        - url: http://127.0.0.1:4010/v1
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, documents, responseOnly]
              properties:
                title: { type: string }
                password: { type: string, format: password, writeOnly: true }
                metadata:
                  type: object
                  properties:
                    id: { type: integer }
                    privateNote: { type: string, writeOnly: true }
                tags: { type: array, items: { type: string } }
                documents:
                  type: array
                  items: { type: string, format: binary }
                  description: Select one or more local files.
                responseOnly: { type: string, readOnly: true }
            examples:
              standard:
                summary: Documents with metadata
                value:
                  title: Example upload
                  password: fixture-upload-password
                  metadata: { id: 1, privateNote: fixture-private-note }
                  tags: [one, two]
                  documents: [select-a-local-file]
              minimal:
                summary: Minimal upload
                value: { title: Minimal, documents: [select-a-local-file] }
          application/json:
            schema: { type: object, properties: { title: { type: string } } }
            example: { title: JSON alternative }
      responses:
        '200':
          description: Received multipart parts
          content:
            application/json:
              schema: { type: object }
        '400': { description: Invalid upload }
components:
  schemas:
    BodyInput:
      type: object
      required: [name, enabled, count, id]
      properties:
        name: { type: string, description: Display name. }
        enabled: { type: boolean }
        count: { type: integer, minimum: 0 }
        id: { type: integer }
        mode: { type: string, enum: [auto, manual] }
        note: { type: [string, 'null'], default: null }
        options: { type: array, items: { type: string } }
        metadata: { type: object }
        password: { type: string, format: password, writeOnly: true }
        responseOnly: { type: string, readOnly: true }
        optional: { type: string, default: optional-default }
        fixed: { type: string, const: fixed }
        profile:
          $ref: '#/components/schemas/NestedProfile'
    NestedProfile:
      type: object
      required: [name, id]
      properties:
        name: { type: string }
        id: { type: integer }
        privateNote: { type: string, writeOnly: true }
        responseOnly: { type: string, readOnly: true }
        address:
          type: [object, 'null']
          properties:
            city: { type: string }
            zip: { type: string }
        manager:
          $ref: '#/components/schemas/NestedProfile'
        settings:
          type: object
          writeOnly: true
          properties:
            secret: { type: string }

    Colors:
      type: array
      items: { type: string }
    Identifier:
      type: integer
      description: A nonnegative numeric identifier.
      minimum: 0
      maximum: 1000
      readOnly: true
      deprecated: true
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:4020/authorize
          tokenUrl: http://127.0.0.1:4020/token
          scopes:
            projects:read: Read projects
    bearer:
      type: http
      scheme: bearer
