openapi: 3.1.0
info:
  title: Projekte
  version: v1
servers:
  - url: http://127.0.0.1:4010/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:4020/authorize
          tokenUrl: http://127.0.0.1:4020/token
          scopes:
            projects:read: Read projects
paths:
  /projects:
    get:
      operationId: listProjects
      summary: Projekte auflisten
      tags: [Projekte]
      security:
        - bearer: []
        - oauth: [projects:read]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Projekte
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: [active, paused]
                          description: Aktueller Projektstatus.
                        legacyId:
                          type: string
                          deprecated: true
                          description: Verwende stattdessen id.
