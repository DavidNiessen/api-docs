name: Read-only registry download diagnostics

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing or attempted package version to inspect without writing
        type: string
        default: '0.2.0-candidate.6'
        required: true
  push:
    branches: ['fix/github-registry-downloads']
    paths:
      - scripts/diagnose-registry-downloads.mjs
      - .github/workflows/registry-download-diagnostics.yml

permissions:
  contents: read
  packages: read

env:
  NODE_USE_ENV_PROXY: '1'

jobs:
  observe:
    name: Observe registry response metadata without following redirects
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Inspect only the configured repository's package endpoints
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          DIAGNOSTIC_VERSION: ${{ inputs.version || '0.2.0-candidate.6' }}
        run: node scripts/diagnose-registry-downloads.mjs
