name: Repository quality

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Check formatting and lint
        run: npm run check
      - name: Build demo publication
        run: npm run demo:build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test reader and API playground
        run: npm run test:e2e
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run check:pr-title

  database:
    name: Server integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: apidocs
          POSTGRES_DB: apidocs
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apidocs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://apidocs:isolated-ci-fixture@127.0.0.1:5432/apidocs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio
  java:
    name: Java ${{ matrix.java }} / Boot ${{ matrix.boot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['3.5.16', '4.1.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-java-fixture.mjs
      - name: Verify Java consumers
        working-directory: integrations/java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums -Dspring-boot.version="$BOOT_VERSION" verify
  quality:
    name: Quality
    if: always()
    needs: [source, database, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          JAVA_RESULT: ${{ needs.java.result }}
        run: test "$SOURCE_RESULT" = success && test "$DATABASE_RESULT" = success && test "$JAVA_RESULT" = success
