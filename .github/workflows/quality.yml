name: Repository quality

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pnpm:
    name: pnpm frozen workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts "$(node --input-type=module -e 'import p from "./package.json" with {type:"json"}; console.log(p.packageManager)')"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=moderate
      - run: pnpm run check
      - name: Verify prepared release lockfile
        run: node scripts/test-pnpm-release.mjs
      - name: Require unchanged dependency metadata
        run: git diff --exit-code -- package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml

  source:
    name: Source and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Set up snippet Java runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check formatting and lint
        run: npm run check
      - name: Set up first-party Go snippet toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build demo publication
        run: npm run demo:build
      - name: Execute generated snippets in all five languages
        run: npm run test:snippets
      - name: Execute first-party Go plugin snippets
        run: npm run test:go-snippets
      - name: Verify installed npm archive consumers
        id: packages
        run: npm run test:packages
      - name: Validate authored examples offline
        run: node packages/cli/dist/main.js doctor examples/demo --strict
      - name: Check first-party plugin conformance
        run: |
          node packages/cli/dist/main.js plugin-check release-label.mjs examples/plugins --trust-plugins
          node packages/cli/dist/main.js plugin-check brand-theme.mjs examples/plugins --trust-plugins
          node packages/cli/dist/main.js plugin-check deployment.mjs examples/source-plugin --trust-plugins
          node packages/cli/dist/main.js plugin-check go.mjs examples/snippet-plugin --trust-plugins
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test reader and API playground
        id: browser
        run: npm run test:e2e
      - name: Retain candidate archives and validation reports
        if: always() && (steps.packages.outcome == 'success' || steps.browser.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-validation-${{ github.sha }}
          path: |
            .api-docs/npm-candidates/**/*.tgz
            .api-docs/npm-candidates/**/manifest.json
            .api-docs/npm-candidates/**/consumer-result.json
            .api-docs/npm-candidates/**/consumer-package-lock.json
            .api-docs/npm-candidates/**/consumer-sbom.cdx.json
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run check:pr-title

  pages-demo:
    name: Static mock demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run demo:pages
      - run: node packages/cli/dist/main.js doctor examples/pages-demo --strict
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - name: Retain tested static demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-demo-${{ github.sha }}
          overwrite: true
          path: .api-docs/pages-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain demo browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-demo-browser-${{ github.sha }}
          path: |
            playwright-pages-report/
            .api-docs/pages-screenshots/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  database:
    name: Server integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: apidocs
          POSTGRES_DB: apidocs
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apidocs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://apidocs:isolated-ci-fixture@127.0.0.1:5432/apidocs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:studio
  java:
    name: Java ${{ matrix.java }} / Boot ${{ matrix.boot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['3.5.16', '4.1.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-java-fixture.mjs
      - name: Verify installed baseline JAR consumers
        id: installed-java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: npm run test:java-consumers -- --boot "$BOOT_VERSION"
      - name: Clear generated Java test reports
        run: node scripts/check-java-results.mjs --clear
      - name: Verify Java consumers
        working-directory: integrations/java
        env:
          BOOT_VERSION: ${{ matrix.boot }}
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums -Dspring-boot.version="$BOOT_VERSION" verify
      - name: Require current manifest and host test results
        run: node scripts/check-java-results.mjs
      - name: Retain installed Java candidate evidence
        if: always() && (steps.installed-java.outcome == 'success' || steps.installed-java.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-java-${{ matrix.java }}-boot-${{ matrix.boot }}-${{ github.run_id }}
          path: |
            .api-docs/java-candidates/**/report.json
            .api-docs/java-candidates/**/*.cdx.json
            .api-docs/java-candidates/**/*.jar
            .api-docs/java-candidates/**/*.pom
            .api-docs/java-candidates/**/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  isolated-builds:
    name: Isolated documentation builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build approved worker from this checkout
        run: docker build --target isolated-builder --iidfile /tmp/api-docs-builder.id .
      - name: Verify isolated builds and failure cleanup
        run: |
          mkdir -p .api-docs
          ISOLATED_BUILD_IMAGE="$(cat /tmp/api-docs-builder.id)" node scripts/test-isolated-builds.mjs > .api-docs/isolated-build-evidence.json
      - name: Retain local control and artifact receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-builds-${{ github.sha }}
          path: .api-docs/isolated-build-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality
    if: always()
    needs: [pnpm, source, database, java, isolated-builds, pages-demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          PNPM_RESULT: ${{ needs.pnpm.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          PAGES_RESULT: ${{ needs.pages-demo.result }}
          ISOLATED_RESULT: ${{ needs.isolated-builds.result }}
        run: test "$PNPM_RESULT" = success && test "$SOURCE_RESULT" = success && test "$DATABASE_RESULT" = success && test "$JAVA_RESULT" = success && test "$ISOLATED_RESULT" = success && test "$PAGES_RESULT" = success
