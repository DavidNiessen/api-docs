name: Review publication plan

on:
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Successful Verified release candidate run ID at this exact tag
        type: string
        required: true
      candidate-run-attempt:
        description: Successful candidate run attempt (rerun all jobs)
        type: string
        default: '1'
        required: true

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Verify immutable candidates and prepare a publication plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-release-source.mjs --publication
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate-run-id }}
          name: release-npm-${{ inputs.candidate-run-id }}-${{ inputs.candidate-run-attempt }}
          path: .api-docs/release-assets/npm/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate-run-id }}
          name: release-java-${{ inputs.candidate-run-id }}-${{ inputs.candidate-run-attempt }}
          path: .api-docs/release-assets/java/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate-run-id }}
          name: release-container-${{ inputs.candidate-run-id }}-${{ inputs.candidate-run-attempt }}
          path: .api-docs/release-assets/container/
      - name: Verify successful upstream run, source, provenance and namespace policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate-run-attempt }}
        run: node scripts/check-publication.mjs "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT"
      - name: Retain reviewable publication plan and signature-verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .api-docs/publication/
            .api-docs/release-verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Display publication blockers without publishing
        run: |
          node --input-type=module <<'NODE'
          import {readFile, appendFile} from 'node:fs/promises';
          const plan = JSON.parse(await readFile('.api-docs/publication/plan.json', 'utf8'));
          const lines = [
            `Candidate: ${plan.ref} at ${plan.commit}; run ${plan.runId}/${plan.runAttempt}.`,
            `Verified producer subjects: ${plan.proof.subjects.length}.`,
            `npm: ${plan.npm.packages.length} packages, ${plan.npm.version}, tag ${plan.npm.tag}.`,
            `Maven: ${plan.maven.groupId}:${plan.maven.version}.`,
            `Container: ${plan.container.repository}:${plan.container.tag}.`,
            '',
            ...plan.blockers.map((text) => `- ${text}`),
            '',
            'This read-only workflow neither approves nor publishes distributions.',
          ];
          await appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
